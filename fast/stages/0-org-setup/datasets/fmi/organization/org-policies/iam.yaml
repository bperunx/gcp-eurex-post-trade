---
# yaml-language-server: $schema=../../../../schemas/org-policies.schema.json

# Note: iam.allowedPolicyMemberDomains is omitted while organization 149750641473
# runs domainless (no Cloud Identity customer_id). Enable once a domain is linked.

iam.disableAuditLoggingExemption:
  rules:
    - enforce: true

iam.automaticIamGrantsForDefaultServiceAccounts:
  rules:
    - enforce: true

iam.disableServiceAccountKeyCreation:
  rules:
    - enforce: true

iam.disableServiceAccountKeyUpload:
  rules:
    - enforce: true

iam.managed.disableServiceAccountApiKeyCreation:
  rules:
    - enforce: true

iam.serviceAccountKeyExposureResponse:
  rules:
    - allow:
        values:
          - is:DISABLE_KEY

iam.workloadIdentityPoolAwsAccounts:
  rules:
    - deny:
        all: true

iam.workloadIdentityPoolProviders:
  rules:
    - allow:
        values:
          - https://token.actions.githubusercontent.com
